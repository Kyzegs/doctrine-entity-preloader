    </g>

    <!-- Icon tile: stacked layers + load arrow (preloading) -->
    <g transform="translate(108,86)">
      <rect width="128" height="128" rx="30" fill="url(#tile)"/>
      <rect width="128" height="128" rx="30" fill="#ffffff" opacity="0.06"/>
      <g transform="translate(28,30)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M36 4 66 19 36 34 6 19z" fill="#ffffff" stroke="none"/>
        <path d="M9 33 36 46 63 33" opacity="0.78"/>
        <path d="M9 47 36 60 63 47" opacity="0.5"/>
      </g>
    </g>

    <!-- Title -->
    <g transform="translate(288,0)">
